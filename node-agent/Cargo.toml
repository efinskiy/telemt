[package]
name = "telemt-node-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
telemt-managed = { path = "../managed" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
