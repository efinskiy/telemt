[package]
name = "telemt-admin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"
maxminddb = "=0.26.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
