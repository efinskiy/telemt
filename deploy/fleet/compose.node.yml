name: telemt-node
services:
  node:
    image: "${TELEMT_IMAGE_PREFIX:-ghcr.io/efinskiy/telemt}-node:${TELEMT_IMAGE_TAG:?Set TELEMT_IMAGE_TAG to main or sha-COMMIT}"
    network_mode: host
    user: "0:0"
    volumes: ['${NODE_CONFIG_DIR:?Set NODE_CONFIG_DIR}:/etc/telemt:rw', node_state:/var/lib/telemt]
    working_dir: /var/lib/telemt
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 65s
    healthcheck:
      test: [CMD, /app/telemt, healthcheck, /etc/telemt/config.toml, --mode, liveness]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits: {nofile: {soft: 65536, hard: 262144}}
    logging: {driver: json-file, options: {max-size: 50m, max-file: '3'}}
volumes:
  node_state:
