name: telemt-fleet
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: telemt
      POSTGRES_USER: telemt
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [management]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U telemt -d telemt"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
  admin:
    build: {context: ../.., dockerfile: deploy/fleet/Dockerfile, target: admin}
    image: telemt-admin:local
    user: "${ADMIN_UID:-10001}:${ADMIN_GID:-10001}"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_MASTER_KEY_FILE: /run/secrets/master_key
      ADMIN_ORIGIN: "https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}"
      RUST_LOG: info
    secrets: [database_url, master_key]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [management]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 65s
    logging: {driver: json-file, options: {max-size: 20m, max-file: '3'}}
  nginx:
    image: nginx:1.28-alpine
    environment:
      ADMIN_DOMAIN: "${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}"
      NGINX_ENVSUBST_FILTER: '^ADMIN_DOMAIN$'
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx.https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - challenges:/var/www/acme:ro
    depends_on: [admin]
    networks: [management]
    restart: unless-stopped
    stop_grace_period: 20s
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [certificate]
    volumes: [certificates:/etc/letsencrypt, challenges:/var/www/acme]
  node:
    profiles: [node]
    build: {context: ../.., dockerfile: deploy/fleet/Dockerfile, target: node}
    image: telemt-node:local
    network_mode: host
    # Only bind privilege is retained; root owns the isolated config/state mounts.
    user: "0:0"
    volumes: ['${NODE_CONFIG_DIR:?Set NODE_CONFIG_DIR}:/etc/telemt:rw', node_state:/var/lib/telemt]
    working_dir: /var/lib/telemt
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 65s
    healthcheck:
      test: [CMD, /app/telemt, healthcheck, /etc/telemt/config.toml, --mode, liveness]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits: {nofile: {soft: 65536, hard: 262144}}
    logging: {driver: json-file, options: {max-size: 50m, max-file: '3'}}
  probe:
    profiles: [probe]
    build: {context: ../.., dockerfile: deploy/fleet/Dockerfile, target: probe}
    image: telemt-probe:local
    user: "${ADMIN_UID:-10001}:${ADMIN_GID:-10001}"
    environment:
      PROBE_CONTROLLER: "https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}"
      PROBE_TOKEN_FILE: /run/secrets/probe_token
      PROBE_REFERENCE_URL: "${PROBE_REFERENCE_URL:?Set a reachable independent HTTPS network reference}"
    secrets: [probe_token]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  management:
volumes:
  database:
  certificates:
  challenges:
  node_state:
secrets:
  database_password: {file: ./secrets/database_password}
  database_url: {file: ./secrets/database_url}
  master_key: {file: ./secrets/master_key}
  probe_token: {file: ./secrets/probe_token}
