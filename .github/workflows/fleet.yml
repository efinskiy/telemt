name: Fleet control and shaping
on:
  push:
  pull_request:
concurrency:
  group: fleet-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: telemt_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: telemt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U telemt_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TELEMT_TEST_DATABASE_URL: postgresql://telemt_test:test-only-password@127.0.0.1:5432/telemt_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            admin/backend/target
            agent/target
            tools/shaping-harness/target
          key: fleet-rust-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fleet-rust-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}-
      - run: cargo check --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
      - run: cargo test --manifest-path tools/shaping-harness/Cargo.toml --locked
      - name: Resolve GeoIP database month
        id: geoip-month
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "TELEMT_TEST_GEOIP_DATABASE=$RUNNER_TEMP/geoip/dbip-city-lite.mmdb" >> "$GITHUB_ENV"
      - name: Cache GeoIP test database
        id: geoip-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.TELEMT_TEST_GEOIP_DATABASE }}
          key: fleet-geoip-dbip-city-${{ steps.geoip-month.outputs.month }}
      - name: Prepare real GeoIP database for integration tests
        if: steps.geoip-cache.outputs.cache-hit != 'true'
        env:
          GEOIP_MONTH: ${{ steps.geoip-month.outputs.month }}
        run: python3 deploy/fleet/update_geoip.py --month "$GEOIP_MONTH" --destination "$TELEMT_TEST_GEOIP_DATABASE"
      - run: cargo test --manifest-path admin/backend/Cargo.toml --locked -- --include-ignored
      - run: cargo test --manifest-path agent/Cargo.toml --locked
      - run: cargo clippy --manifest-path admin/backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets --locked -- -D warnings
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fleet-browser-results
          path: admin/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
